<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bruno Viana — BV Viagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-dark:#0B4A50;
    --teal:#12747C;
    --teal-deep:#083539;
    --orange:#F4841E;
    --orange-dark:#D96C0C;
    --paper:#FBF8F2;
    --ink:#17302E;
    --ink-soft:#4B615F;
    --line:#CBDBDA;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:radial-gradient(120% 140% at 50% -10%, #135961 0%, var(--teal-deep) 55%, #06282b 100%);
    font-family:'Space Grotesk', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .stage{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:380px;
    background:var(--paper);
    border-radius:22px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.06) inset;
    overflow:hidden;
    opacity:0;
    transform:translateY(18px);
    animation:riseIn .7s cubic-bezier(.2,.7,.3,1) forwards;
  }

  @keyframes riseIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .card-top{
    padding:34px 30px 26px;
    text-align:center;
  }

  .logo{
    width:88px;
    height:auto;
    margin:0 auto 14px;
    display:block;
  }

  .name{
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.01em;
    color:var(--teal-deep);
    margin:0 0 4px;
  }

  .role{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    font-weight:500;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--orange-dark);
    margin:0;
  }

  /* flight path divider */
  .flightpath{
    position:relative;
    height:34px;
    margin:22px 0 4px;
    padding:0 30px;
  }
  .flightpath svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }
  .flightpath .dashes{
    stroke:var(--line);
    stroke-width:1.6;
    stroke-dasharray:1,7;
    stroke-linecap:round;
    fill:none;
  }
  .flightpath .plane{
    fill:var(--orange);
    offset-path:path('M4,17 C 90,2 190,32 280,10 C 330,-2 355,10 372,17');
    offset-rotate:auto;
    animation:fly 2.6s ease-in-out .5s 1 both;
  }
  @keyframes fly{
    0%{ offset-distance:0%; opacity:0; }
    8%{ opacity:1; }
    100%{ offset-distance:100%; opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .flightpath .plane{ animation:none; offset-distance:60%; }
  }

  .fields{
    padding:6px 30px 26px;
    display:flex;
    flex-direction:column;
    gap:13px;
  }
  .field{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    border-bottom:1px dotted var(--line);
    padding-bottom:9px;
  }
  .field:last-child{ border-bottom:none; padding-bottom:0; }
  .field-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .field-value{
    font-size:14.5px;
    font-weight:600;
    color:var(--teal-deep);
    text-align:right;
  }

  /* perforated ticket cut with notches */
  .perforation{
    position:relative;
    height:0;
  }
  .perforation::before{
    content:"";
    position:absolute;
    left:26px; right:26px; top:-1px;
    border-top:2px dashed var(--line);
  }
  .notch{
    position:absolute;
    top:-13px;
    width:26px; height:26px;
    background:var(--teal-deep);
    background:radial-gradient(circle at 30% 30%, #135961, #06282b 80%);
    border-radius:50%;
  }
  .notch.left{ left:-13px; }
  .notch.right{ right:-13px; }

  .actions{
    padding:26px 26px 30px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:13px 18px;
    border-radius:12px;
    font-family:'Space Grotesk', sans-serif;
    font-size:14.5px;
    font-weight:600;
    text-decoration:none;
    border:none;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:focus-visible{
    outline:3px solid var(--orange);
    outline-offset:2px;
  }
  .btn:active{ transform:scale(0.98); }

  .btn-primary{
    background:linear-gradient(180deg, var(--orange) 0%, var(--orange-dark) 100%);
    color:#fff;
    box-shadow:0 10px 20px -8px rgba(217,108,12,0.55);
  }
  .btn-primary:hover{ box-shadow:0 14px 24px -8px rgba(217,108,12,0.65); transform:translateY(-1px); }

  .btn-row{
    display:flex;
    gap:10px;
  }
  .btn-secondary{
    flex:1;
    background:#fff;
    color:var(--teal-deep);
    border:1.4px solid var(--line);
    padding-left:10px;
    padding-right:10px;
    white-space:nowrap;
    font-size:13.5px;
  }
  .btn-secondary:hover{ border-color:var(--teal); background:#F3FAF9; transform:translateY(-1px); }

  .icon{ width:17px; height:17px; flex:none; }

  .card-footer{
    text-align:center;
    padding:0 26px 24px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0.8;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(20px);
    background:var(--teal-deep);
    color:#fff;
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    font-family:'Space Grotesk', sans-serif;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (max-width:360px){
    .card-top{ padding:28px 22px 22px; }
    .fields{ padding:6px 22px 22px; }
    .actions{ padding:22px 20px 26px; }
    .flightpath{ padding:0 22px; }
  }
</style>
</head>
